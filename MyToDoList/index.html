<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ali's To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>My Goals</h1>

    <ul class="todo-list">

        <li>
            <input type="checkbox" id="python">
            <label for="python">Learn Python</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link"
                       href="https://www.codecademy.com/learn/learn-python-3"
                       target="_blank">
                        Python Course
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="aime">
            <label for="aime">Qualify for AIME</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link"
                       href="https://artofproblemsolving.com/wiki/index.php/AMC_Problems_and_Solutions"
                       target="_blank">
                        AMC Practice
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="chemistry">
            <label for="chemistry">Finish AP Chemistry</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link"
                       href="https://www.khanacademy.org/science/ap-chemistry"
                       target="_blank">
                        Chemistry Practice
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="sat">
            <label for="sat">Score 1580+ on the SAT</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link"
                       href="https://www.khanacademy.org/test-prep/sat"
                       target="_blank">
                        SAT Practice
                    </a>
                </li>
            </ul>
        </li>

    </ul>

</body>

</html>
