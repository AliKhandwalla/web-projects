<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="blog-post-card">

        <img
            class="post-img"
            src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
            alt="Notebook and study materials"
        >

        <div class="post-content">

            <h2 class="post-title">
                My Road to AIME
            </h2>

            <p class="post-excerpt">
                How I am studying for the AMC and trying to qualify for AIME.
            </p>

            <a class="read-more" href="#">
                Read More
            </a>

        </div>

    </div>

</body>

</html>
